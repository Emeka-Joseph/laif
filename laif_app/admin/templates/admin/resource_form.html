{% extends "base.html" %}{% block title %}Add resource · LAIF{% endblock %}{% block content %}<div class="form-wrap"><div class="eyebrow">Resource library</div><h2>Publish a resource</h2><form method="post" enctype="multipart/form-data"><label>Title<input name="title" required></label><label>Category<select name="category">{% for category in categories %}<option value="{{ category }}">{{ category }}</option>{% endfor %}</select></label><label>Description<textarea name="description" placeholder="A short description for the resource card"></textarea></label><label>Upload file (PDF, DOC, PPT, EPUB, MP3, MP4, ZIP)<input type="file" name="file"></label><label>Or an external link<input name="link" placeholder="https://..."></label><button class="btn" style="margin-top:20px">Publish resource</button></form><p class="meta" style="margin-top:14px">Attach either a file or a link — the resource will be listed in the library under the chosen category.</p></div>{% endblock %}
