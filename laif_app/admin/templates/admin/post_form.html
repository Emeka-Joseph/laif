{% extends "base.html" %}{% block title %}{{ "Edit" if post else "Create" }} post · LAIF{% endblock %}{% block content %}<div class="form-wrap"><div class="eyebrow">Admin dashboard</div><h2>{{ "Edit your post" if post else "Create a new post" }}</h2><form method="post"><label>Title<input name="title" value="{{ post.title if post else '' }}" required></label><label>Short excerpt<input name="excerpt" value="{{ post.excerpt if post else '' }}"></label><label>Image filename<input name="image" value="{{ post.image if post else '' }}" placeholder="e.g. 4C4A3910.JPG"></label><label>Content<textarea name="content" required>{{ post.content if post else '' }}</textarea></label><button class="btn" style="margin-top:20px">Publish</button></form></div>{% endblock %}
